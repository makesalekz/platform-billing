syntax = "proto3";

package platform_billing.v1;

option go_package = "gitlab.calendaria.team/services/platform-billing/api/platform_billing/v1;platform_billing_v1";

message Commission {
  int64 id = 1;
  int64 tenant_id = 2;
  string period_start = 3;
  string period_end = 4;
  string gmv = 5;
  string excluded_amount = 6;
  string taxable_amount = 7;
  string rate = 8;
  string commission = 9;
  string status = 10;
  string created_at = 11;
  string manager_share_rate = 12;
  string manager_share = 13;
}

message Exclusion {
  int64 id = 1;
  int64 tenant_id = 2;
  string brand_name = 3;
  repeated int64 sku_ids = 4;
  string start_date = 5;
  string end_date = 6;
  int64 created_by = 7;
  string created_at = 8;
}

message BillingReport {
  int64 tenant_id = 1;
  string period_start = 2;
  string period_end = 3;
  string total_gmv = 4;
  string excluded_amount = 5;
  string taxable_amount = 6;
  string rate = 7;
  string commission = 8;
  string status = 9;
}
